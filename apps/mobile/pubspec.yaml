name: raja_rani
description: Raja Rani — e-learning student app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.6.0

  # Secure token storage — never SharedPreferences for auth tokens
  flutter_secure_storage: ^9.2.2

  # Code generation for immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Video playback (used by the lesson player in Phase 9)
  video_player: ^2.9.1

  # Payment checkout UI (Razorpay) — needs your live/test key at runtime,
  # see docs/PAYMENTS.md in the repo root for the Play Billing caveat
  razorpay_flutter: ^1.3.7

  # Opens the live-class join URL (Jitsi, or whatever provider replaces it)
  url_launcher: ^6.3.0

  # Google Sign-In — needs a real Google Cloud OAuth client ID at build/
  # runtime, see apps/mobile/MOBILE_SETUP.md for the one-time setup this
  # requires (same category of external-account dependency as Razorpay).
  google_sign_in: ^6.2.1

  # Push notifications
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
